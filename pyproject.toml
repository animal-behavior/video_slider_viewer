[project]
name = "video-slider-viewer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "PyQt5>=5.15",
    "PyQt5-Qt5==5.15.2 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10",
]

[tool.uv.workspace]
members = [
    "video_slider_viewer",
]
